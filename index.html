<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Priority Codes for $0 Dollar</title>
<style>
:root{--navy:#111a33;--blue:#315bea;--bg:#f4f7ff;--card:#fff;--muted:#65718a;--green:#eaf7e5;--line:#dbe2ef}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#f3f6ff,#eef3ff);color:var(--navy)}
.wrap{max-width:760px;margin:48px auto;padding:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 35px rgba(35,55,100,.10);padding:28px}
h1{margin:0 0 8px;font-size:30px}.sub{margin:0 0 26px;color:var(--muted)}label{display:block;font-weight:700;margin:18px 0 8px}
select{width:100%;font:inherit;padding:13px 14px;border:1px solid #cbd5e1;border-radius:10px;background:white;color:#17213b;outline:none}select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(49,91,234,.12)}
.result{margin-top:24px;padding:22px;border-radius:14px;background:var(--green);border-left:6px solid #56a847}.result small{display:block;color:#56705d;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.code{font-size:34px;font-weight:800;margin-top:5px}.note{margin-top:8px;color:#405347;line-height:1.45}
.actions{display:flex;gap:10px;margin-top:18px}.btn{border:1px solid #cbd5e1;border-radius:10px;padding:10px 16px;background:#f8fafc;color:#17213b;font-weight:650;cursor:pointer}.btn:hover{background:#eef2ff}
@media(max-width:520px){.wrap{margin:15px auto;padding:12px}.card{padding:20px}h1{font-size:25px}}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <h1>Priority Codes for $0 Dollar</h1>
    <p class="sub">Select a category and scenario to find the applicable priority code.</p>

    <label for="category">1. $0 Category</label>
    <select id="category">
      <option value="">Select a category...</option>
      <option>HOS</option><option>UD</option><option>Orbits</option><option>SET</option><option>Trade and Exchange</option>
    </select>

    <label for="scenario">2. Scenario</label>
    <select id="scenario" disabled><option value="">Select a category first...</option></select>

    <div id="result" class="result" hidden aria-live="polite">
      <small>Priority Code</small><div id="code" class="code"></div><div id="note" class="note"></div>
    </div>
    <div class="actions"><button id="reset" class="btn" type="button">Reset</button></div>
  </section>
</main>
<script>
const data={
'HOS':[['Yes','64'],['No','30'],['HOS - Yes, with Orbits','64'],['HOS - No, with Orbits','40'],['HOS - Yes, with UD','70']],
'UD':[['Yes','70'],['UD with Orbits','70'],['0$ - UD','PC 72 only if mentioned']],
'Orbits':[['RC 30% and below','40'],['RC 31% and above','70']],
'SET':[['0$ if matches in SET','100 or 105'],['0$ if Unmatched in SET','Default PC or HOS or UD PC if given in salesforce']],
'Trade and Exchange':[['Revise','-']]
};
const category=document.getElementById('category'),scenario=document.getElementById('scenario'),result=document.getElementById('result'),code=document.getElementById('code'),note=document.getElementById('note');
function clearResult(){result.hidden=true;code.textContent='';note.textContent=''}
category.addEventListener('change',()=>{clearResult();scenario.innerHTML='';if(!data[category.value]){scenario.disabled=true;scenario.innerHTML='<option value="">Select a category first...</option>';return}scenario.disabled=false;scenario.add(new Option('Select a scenario...',''));data[category.value].forEach(([s,c])=>{let o=new Option(s,s);o.dataset.code=c;scenario.add(o)})});
scenario.addEventListener('change',()=>{clearResult();let o=scenario.options[scenario.selectedIndex];if(!o||!o.value)return;result.hidden=false;let v=o.dataset.code;if(v==='PC 72 only if mentioned'){code.textContent='72';note.textContent='Use PC 72 only if mentioned.'}else if(v==='Default PC or HOS or UD PC if given in salesforce'){code.textContent='Default / HOS / UD';note.textContent='Use the Priority Code given in Salesforce.'}else if(v==='-'){code.textContent='No Priority Code';note.textContent='Revise.'}else{code.textContent=v;note.textContent='Selected scenario: '+o.value}});
document.getElementById('reset').addEventListener('click',()=>{category.value='';scenario.disabled=true;scenario.innerHTML='<option value="">Select a category first...</option>';clearResult()});
</script>
</body>
</html>
